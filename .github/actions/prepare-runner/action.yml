name: "Setup runner"
description: >
  Install Node.js and pnpm, restore the pnpm store cache, wrap package
  managers with Aikido Safe Chain, then install JS dependencies. Safe Chain
  blocks malware and packages newer than 48 hours by default. Prefer the
  scoped SAFE_CHAIN_MINIMUM_PACKAGE_AGE_EXCLUSIONS allowlist for a single
  package (see the install step); set
  SAFE_CHAIN_MINIMUM_PACKAGE_AGE_HOURS=0 in the calling job's env to bypass
  the age gate in an emergency.
runs:
  using: composite
  steps:
    - name: Install Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22.23.0
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      name: Install pnpm
      id: pnpm-install
    - name: Get pnpm store directory
      id: pnpm-cache
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      name: Setup pnpm cache
      with:
        path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    # Internal Aptos action; org policy leaves this unpinned on @main.
    - uses: aptos-labs/actions/aikidosec-safe-chain@main

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
