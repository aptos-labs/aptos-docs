name: "Setup runner"
description: >
  Install Node.js and pnpm, restore the pnpm store cache, wrap package
  managers with Aikido Safe Chain, then install JS dependencies. Safe Chain
  blocks malware and packages newer than 48 hours by default. Prefer the
  scoped SAFE_CHAIN_MINIMUM_PACKAGE_AGE_EXCLUSIONS allowlist for a single
  package (see the install step); set
  SAFE_CHAIN_MINIMUM_PACKAGE_AGE_HOURS=0 in the calling job's env to bypass
  the age gate in an emergency.
runs:
  using: composite
  steps:
    - name: Install Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22.23.0
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      name: Install pnpm
      id: pnpm-install
    - name: Get pnpm store directory
      id: pnpm-cache
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      name: Setup pnpm cache
      with:
        path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    # Internal Aptos action; org policy leaves this unpinned on @main.
    - uses: aptos-labs/actions/aikidosec-safe-chain@main

    - name: Install dependencies
      shell: bash
      # Scoped Safe Chain exemption for the CVE-2026-93748 fix: the
      # http-cache-semantics@4.3.0 release (pinned via the pnpm override in
      # pnpm-workspace.yaml) is younger than Safe Chain's 48h minimum package
      # age gate, so its tarball download is blocked without this. Scoped to
      # this one package name (Safe Chain exclusions don't take versions);
      # remove once 4.3.0 has matured past the gate (after 2026-10-06T02:56:05Z)
      # so future releases of this package go through the normal age check.
      env:
        SAFE_CHAIN_MINIMUM_PACKAGE_AGE_EXCLUSIONS: http-cache-semantics
      run: pnpm install --frozen-lockfile
