# pnpm 12 otherwise prepends an environment document to pnpm-lock.yaml that
# GitHub's dependency graph currently reads as an empty project graph.
pmOnFail: ignore

allowBuilds:
  '@firebase/util': true
  '@swc/core': true
  core-js: true
  esbuild: true
  protobufjs: true
  sharp: true
  simple-git-hooks: true
  vue-demi: true

patchedDependencies:
  '@astrojs/vercel': patches/@astrojs__vercel.patch
  starlight-openapi@0.27.1: patches/starlight-openapi@0.27.1.patch
  'vite-plugin-monaco-editor@1.1.0': patches/vite-plugin-monaco-editor@1.1.0.patch

overrides:
  # starlight-openapi's markdown-satteri peer must stay on the 0.4.3 line
  # (satteri 0.10.5): resolving it to 0.4.10 (satteri 0.11.7) breaks
  # prerendering of the OpenAPI routes with "HastReader was handed a
  # buffer in wire format version 52 (expected 1), written by another
  # satteri version".
  'starlight-openapi>@astrojs/markdown-satteri': 0.4.3
  h3: 1.15.11
  'path-to-regexp@^6': 6.3.0
  'minimatch@>=7 <11.0.1': 11.0.9
  'glob@>=9 <=14.0.1': 14.0.6
  'undici@^5||^6': 6.29.1
  'undici@^7': 7.30.2
  'undici@^8': 8.13.1
  'ajv@^8': 8.20.0
  'svgo@^3': 3.3.5
  'svgo@^4': 4.1.0
  dompurify: 3.4.18
  'yauzl@^3': 3.4.0
  'yaml@^2': 2.8.3
  'smol-toml@^1': 1.9.1
  'defu@^6': 6.1.7
  devalue: 5.9.4
  protobufjs: 7.6.6
  uuid: 11.1.1
  'postcss@<8.5.25': 8.5.33
  '@grpc/grpc-js': 1.9.16
  '@babel/core@^7': 7.29.13
  esbuild: 0.28.2
  'markdown-it@^14': 14.3.3
  '@opentelemetry/core': 2.8.0
  astro-auto-import: 0.5.2
  'tar@^7': 7.5.23
  'brace-expansion@^1': 1.1.22
  'brace-expansion@^2': 2.1.8
  'brace-expansion@>=3': 5.0.13
  'form-data@^4': 4.0.6
  'js-yaml@^3': 3.15.2
  'js-yaml@^4': 4.3.2
  fast-uri: 3.1.9
  'zod@<4.6.6': 4.6.7
  shell-quote: 1.12.0
  'linkify-it@^5': 5.0.2
  ts-deepmerge: 8.0.0
  sharp: 0.35.5
  '@iconify/tools': 5.0.14
  'nanoid@^3': 3.3.20
  'nanoid@^4||^5': 5.1.16
  browserslist: 4.28.9
  'fflate@^0.4': 0.4.9
  'fflate@^0.7': 0.7.5
  # CVE GHSA-rj75-hqrm-r3gf: postcss-selector-parser before 7.1.6 has
  # quadratic selector parsing. 6.x has no patched release.
  'postcss-selector-parser@<7.1.6': 7.1.6
  # GHSA-68fv-2mgg-jv7q: source-map-js before 1.2.2.
  'source-map-js@<1.2.2': 1.2.4
  # GHSA-g2v6-rqmx-r4w6: @vue/server-renderer before 3.5.42 (via @vercel/analytics).
  # Pin the newest matured 3.5 release (past the 48-hour age gate).
  vue: 3.5.46
  '@vue/server-renderer': 3.5.46
  # GHSA-238p-pmpm-9mq7: katex before 0.18.2, including mermaid's nested copy.
  katex: 0.19.1
  # CVE-2026-93748 (GHSA-ch52-4w7c-c8xp): http-cache-semantics through 4.2.0
  # can disclose cross-user cached responses via max-stale handling. 4.3.0 is
  # outside the advisory's vulnerable range and clears the audit finding.
  http-cache-semantics: 4.3.0
  # Keep @emnapi/core and @emnapi/runtime on matching 1.11.3 releases so
  # @napi-rs/wasm-runtime doesn't pair @emnapi/core@1.11.3 with 2.0.0-beta.2
  # (which breaks `astro check` with `this.bridge.setLastError is not a function`).
  '@emnapi/core': 1.11.3
  '@emnapi/runtime': 1.11.3

# pnpm settings for this project. Although this repository is not a multi-package
# workspace, pnpm-workspace.yaml is the canonical location for pnpm settings
# (and the only supported location starting in pnpm 11, which stops reading
# non-auth settings from .npmrc).
#
# Refuse to install a published version of any package until it has been on the
# registry for at least 48 hours. This matches Aikido Safe Chain's default
# minimum package age (enforced in CI via aptos-labs/actions/aikidosec-safe-chain)
# so local `pnpm install` and CI cannot drift. The value is in minutes:
# 2 days * 24 hours * 60 minutes = 2880.
#
# Reference: https://pnpm.io/settings#minimumreleaseage
# Aikido Safe Chain: https://github.com/AikidoSec/safe-chain
minimumReleaseAge: 2880

# When `pnpm add <pkg>` records a new dependency, write the exact installed
# version (e.g. "1.2.3") instead of a fuzzy range (e.g. "^1.2.3" or "~1.2.3").
# Combined with the pinned versions in package.json, this guarantees that every
# install resolves to the exact set of versions captured in pnpm-lock.yaml.
#
# Reference: https://pnpm.io/settings#saveexact
saveExact: true
